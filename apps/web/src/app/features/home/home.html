<main class="pagina pilha">
  <section class="banner" aria-labelledby="banner-titulo">
    <div class="banner__texto">
      <h1 id="banner-titulo" class="banner__titulo">{{ salon.nome }}</h1>
      <p class="banner__resumo">{{ salon.resumo }}</p>
    </div>
    <a
      arg-button
      variant="primary"
      size="lg"
      class="banner__acao"
      routerLink="/agendar/profissional"
    >
      <arg-icon name="calendar" /> Agendar horário
    </a>
  </section>

  <article arg-card>
    <h2 arg-card-title class="com-icone">
      <arg-icon name="sparkles" />
      <a arg-card-link routerLink="/shop">Shop</a>
    </h2>
    <p arg-card-description>Produtos que usamos na barbearia. Separe o seu e pague na hora.</p>
  </article>

  <app-como-chegar />
</main>
