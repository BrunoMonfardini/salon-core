<section arg-card aria-labelledby="como-chegar-titulo">
  <h2 arg-card-title id="como-chegar-titulo" class="com-icone">
    <arg-icon name="map-pin" /> Como chegar
  </h2>
  <p arg-card-description>{{ endereco }}</p>
  <div arg-card-actions class="acoes">
    @for (acao of acoes; track acao.rotulo) {
      <a arg-button variant="secondary" [href]="acao.url" target="_blank" rel="noopener">
        <arg-icon [name]="acao.icone" />
        {{ acao.rotulo }}
        <span class="so-leitor">(abre em outra aba)</span>
      </a>
    }
  </div>
  <div arg-card-content>
    <iframe
      class="mapa"
      [src]="mapa"
      title="Mapa com a localização da barbearia"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </div>
</section>
