<section arg-card aria-labelledby="como-chegar-titulo">
  <h2 arg-card-title id="como-chegar-titulo"><arg-icon name="map-pin" /> Como chegar</h2>
  <p arg-card-description>{{ endereco }}</p>
  <div arg-card-content>
    <iframe
      class="mapa"
      [src]="mapa"
      title="Mapa com a localização da barbearia"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </div>
  <footer arg-card-actions class="acoes">
    @for (acao of acoes; track acao.url) {
      <a arg-button variant="secondary" [href]="acao.url" target="_blank" rel="noopener">
        {{ acao.rotulo }}
        <arg-icon name="external-link" />
        <span class="arg-sr-only">(abre em outra aba)</span>
      </a>
    }
  </footer>
</section>
