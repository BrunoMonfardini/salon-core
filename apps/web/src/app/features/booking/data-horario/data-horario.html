<section class="pilha" aria-labelledby="horario-titulo">
  <header class="pilha">
    <h1 id="horario-titulo">Serviço, data e horário</h1>
    <p class="texto-secundario">Com {{ store.profissional()?.nome }}.</p>
  </header>

  <section class="pilha" aria-labelledby="servico-titulo">
    <h2 id="servico-titulo">Serviço</h2>
    <ul class="grade">
      @for (servico of servicosDoProfissional(); track servico.id) {
        <li>
          <app-opcao-card
            [titulo]="servico.nome"
            [nivel]="3"
            [escolhida]="store.servico()?.id === servico.id"
            (escolher)="escolherServico(servico)"
          >
            <p arg-card-description><arg-icon name="clock" /> {{ servico.duracaoMin }} min</p>
            <strong opcaoRodape>{{ preco(servico.precoCentavos) }}</strong>
          </app-opcao-card>
        </li>
      }
    </ul>
  </section>

  @if (store.servico()) {
    <arg-field label="Data" hint="Os dias sem horário livre ficam bloqueados no calendário.">
      <input
        arg-date
        [value]="store.data()"
        (valueChange)="escolherData($event)"
        [min]="hoje"
        [max]="ultimoDia"
        [blocked]="diaBloqueado()"
      />
    </arg-field>
  }

  @if (store.data()) {
    <fieldset
      arg-time-slots
      label="Horário"
      [slots]="horarios()"
      [value]="store.horario()"
      (valueChange)="escolherHorario($event)"
    ></fieldset>
  }

  <div class="acoes">
    <button
      arg-button
      variant="primary"
      type="button"
      [disabled]="!podeContinuar()"
      (click)="continuar()"
    >
      Continuar
    </button>
  </div>
</section>
